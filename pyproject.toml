[project]
name = "blind-diffusion"
version = "0.1.0"
description = "RSSM world model + MPC on RoboMimic low-dim data"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "numpy",
  "pyyaml",
  "hydra-core",
  "omegaconf",
  "torch",
  "h5py",
  "imageio",
  "tqdm",
  "mujoco>=3.5.0",
  "numba",
  "scipy"
]

[project.optional-dependencies]
robomimic = [
  "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git@v0.3.0",
  "robosuite @ git+https://github.com/ARISE-Initiative/robosuite.git@v1.4.1",
  "Cython<3.0",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
