defaults:
  - task: lift
  - model: rssm_small
  - diffusion: diffusion_demo
  - _self_

exp_name: diff_lift
seed: 0

# dataset
seq_len: 32
burn_in: 4
pad_end: 8
batch_size: 64
num_workers: 4
normalize_obs: true
normalize_action: false

# optimization
lr: 1.0e-4
weight_decay: 1.0e-6
epochs: 15
max_train_steps: null
grad_clip: 100.0
log_every: 100

# Conditioning noise is disabled for the frozen protocol. It is intentionally
# separate from robust-WM training and must be enabled only in a versioned run.
robustness:
  belief_noise_std: 0.0

# world model
wm_checkpoint: runs/wm_lift/checkpoints/best.pt

# paths
run_dir: runs

hydra:
  run:
    dir: .
  output_subdir: null
