defaults:
  - task: lift
  - model: rssm_small
  - diffusion: diffusion_demo
  - _self_

exp_name: eval_diff_lift
seed: 0

# env
episodes: 20
max_steps: 500

# eval
eval:
  mode: rhc

normalize_action: false
sampler: ddim
inference_steps: 10
warmup_steps: 5
blackout_period: 20
blackout_duration: 0

# checkpoints
wm_checkpoint: runs/wm_lift/checkpoints/best.pt
diff_checkpoint: runs/diff_lift/checkpoints/best.pt

# paths
run_dir: runs

hydra:
  run:
    dir: .
  output_subdir: null
