defaults:
  - task: lift
  - model: rssm_small
  - _self_

exp_name: wm_lift
seed: 0

# dataset
seq_len: 32
burn_in: 4
batch_size: 64
num_workers: 4
val_fraction: 0.05
pad_end: 8
normalize_obs: true
normalize_action: false

# optimization
lr: 3.0e-4
weight_decay: 1.0e-6
max_steps: 20000
resume_checkpoint: null
log_every: 100
val_every: 1000
grad_clip: 100.0
kl_free_bits: 1.0
kl_scale: 1.0
obs_weight: 1.0
imag_horizon: 0
imag_weight: 0.0
overshoot_weight: 0.0

# Disabled for the frozen expert-only protocol. A versioned recovery run may
# perturb belief inputs while reconstructing clean expert targets.
robustness:
  obs_noise_std: 0.0
  previous_action_noise_std: 0.0

# paths
run_dir: runs

hydra:
  run:
    dir: .
  output_subdir: null
