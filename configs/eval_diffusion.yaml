defaults:
  - task: lift
  - model: rssm_small
  - diffusion: diffusion_small
  - _self_

exp_name: eval_diff_lift
seed: 0

# env
episodes: 20

# eval
eval:
  mode: rhc

# diffusion
horizon: 8
base_ch: 64
timesteps: 100
schedule: cosine

# checkpoints
wm_checkpoint: runs/wm_lift/checkpoints/best.pt
diff_checkpoint: runs/diff_lift/checkpoints/diffusion_epoch_9.pt

# paths
run_dir: runs

hydra:
  run:
    dir: .
  output_subdir: null
