defaults:
  - task: lift
  - model: rssm_image_small
  - diffusion: diffusion_demo
  - _self_

exp_name: eval_image_lift
seed: 0

# env
episodes: 20

# checkpoints
wm_checkpoint: runs/wm_image_lift/checkpoints/best.pt
diff_checkpoint: runs/diff_image_lift/checkpoints/diffusion_epoch_9.pt

# paths
run_dir: runs

# eval
eval:
  mode: image_rhc
  save_video: true
  video_fps: 30
  sensor_block:
    enable: true
    mode: prior  # prior | zero | noise
    every_k: 20
    duration: 5

hydra:
  run:
    dir: .
  output_subdir: null
